name: Public onboarding client contract
on:
  pull_request:
    paths: ['openclaw-skill/**', 'tools/onboarding_acceptance.py', 'tests/test_onboarding.py', '.github/workflows/onboarding-client.yml']
  push:
    branches: [main]
    paths: ['openclaw-skill/**', 'tools/onboarding_acceptance.py', 'tests/test_onboarding.py', '.github/workflows/onboarding-client.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise public client against isolated HTTP/SQLite contract fixture
        run: python3 -m unittest discover -s tests -p 'test_onboarding.py' -v
