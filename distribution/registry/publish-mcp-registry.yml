# STAGING FILE: install in cleanappio/cleanapp-openai/.github/workflows/.
# This distribution repository is not the MCP server implementation.
name: Publish CleanApp MCP registry metadata

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main SHA to publish
        required: true
        type: string
      expected_version:
        description: Reviewed server.json version
        required: true
        default: '1.0.3'
        type: string

permissions:
  contents: read

concurrency:
  group: cleanapp-mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cleanappio/cleanapp-openai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify revision and publication target
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_SHA'])
          assert os.environ['GITHUB_SHA'] == os.environ['EXPECTED_SHA'], 'Reviewed SHA changed'
          x = json.load(open('server.json'))
          assert x['name'] == 'io.github.cleanappio/cleanapp'
          assert x['version'] == os.environ['EXPECTED_VERSION']
          assert x['websiteUrl'] == 'https://www.cleanapp.io/agents'
          assert x['remotes'] == [{'type':'streamable-http','url':'https://live.cleanapp.io/openai/mcp'}]
          assert not x.get('packages'), 'This is a remote-only server listing'
          PY
      - name: Install pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify official publisher
        run: |
          set -euo pipefail
          publisher_archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          publisher_base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$publisher_archive" "$publisher_base/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $publisher_archive" | sha256sum --check --strict
          curl --fail --location --silent --show-error --output "$publisher_archive.sigstore.json" "$publisher_base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob --bundle "$publisher_archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$publisher_archive"
          tar xzf "$publisher_archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate metadata without publishing
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
      - name: Check live public front door and MCP inventory without submitting
        run: |
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://www.cleanapp.io/agents', timeout=20) as r:
              assert r.status == 200 and b'/agents.txt' in r.read(524288)
          with urllib.request.urlopen('https://www.cleanapp.io/agents.txt', timeout=20) as r:
              assert b'MCP endpoint: https://live.cleanapp.io/openai/mcp' in r.read(524288)
          req = urllib.request.Request('https://live.cleanapp.io/openai/mcp', method='POST',
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode(),
              headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'})
          with urllib.request.urlopen(req, timeout=20) as r:
              tools = {x['name'] for x in json.load(r)['result']['tools']}
          assert {'cleanapp_prepare_report','cleanapp_submit_report','cleanapp_report_status'} <= tools
          PY
      - name: Authenticate using this repository's GitHub OIDC identity
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish reviewed remote server metadata
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
